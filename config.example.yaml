# Copy to config.yaml and edit.

# The subscriptions you pay for, as TMDB/JustWatch names them (Settings lets
# you pick from TMDB's list). An exact name match wins, so "Netflix" won't
# also pull in "Netflix Standard with Ads". Without an exact match, a loose
# one is tried ("Disney+" finds "Disney Plus").
# The order here is the order you see watch options in.
services:
  - Netflix
  - Hulu
  - Disney Plus

# Where to watch, best first: your subscriptions > free/with ads (Tubi,
# Pluto TV, ...) > rent/buy. Only the best available tier is shown. Turn off
# the lower tiers here if you don't want them; shows with nowhere left to
# watch are skipped when picking.
include_free: true
include_rent_buy: true

# How a channel's shows share the picks, by their number of episodes:
#   sqrt     (default) long shows come up more, short ones aren't buried
#            (214 vs 14 episodes: about 80/20)
#   episodes every episode equally likely (94/6)
#   shows    every show equally likely (50/50)
# A show's weight multiplies its share.
balance: sqrt

# Optional: add or override search links per service. {q} = URL-encoded show name.
# search_urls:
#   Peacock Premium: https://www.peacocktv.com/search?q={q}

# Optional: an emoji per channel, shown on its button (Settings > Channels
# can set these too).
channels:
  scifi: {emoji: 🚀}

# Each show once. tmdb_id is in the show's URL on themoviedb.org, e.g.
# https://www.themoviedb.org/tv/1400-seinfeld -> 1400.
#   channels: one or more tags; each tag becomes a channel button.
#   weight:   optional, default 1. Multiplies the show's share of picks
#             (weight 2 = twice as likely; see balance above).
#   name:     optional display-name override.
#   links:    optional links to the show on each service (Settings calls
#             these Open links). They beat the default search link.
shows:
  - tmdb_id: 1400       # Seinfeld
    channels: [sitcom]
  - tmdb_id: 2316       # The Office (US)
    channels: [sitcom]
  - tmdb_id: 1668       # Friends
    channels: [sitcom]
  - tmdb_id: 615        # Futurama
    channels: [sitcom, scifi, short]
  - tmdb_id: 655        # Star Trek: The Next Generation
    channels: [scifi]
    weight: 1.5
  - tmdb_id: 60625      # Rick and Morty
    channels: [scifi, short]
  # - tmdb_id: 1400
  #   links:
  #     Netflix: https://www.netflix.com/title/<id>
