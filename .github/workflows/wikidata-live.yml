# Live check that the Wikidata show-link lookup still works (not a required
# check: it depends on an external service). Runs when the lookup changes,
# weekly, and on demand.
name: Wikidata links (live)

on:
  pull_request:
    paths: ["app/wikidata.py", "tools/wikidata_check.py", ".github/workflows/wikidata-live.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wikidata-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m tools.wikidata_check
