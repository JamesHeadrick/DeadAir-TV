# DeadAir - uses the prebuilt image (arm64 + amd64).
#   docker compose up -d                      # first start
#   docker compose pull && docker compose up -d   # update
# To build from source instead, see docker-compose.build.yml.
services:
  deadair-tv:
    image: ghcr.io/jamesheadrick/deadair-tv:latest   # or :1 to stay on 1.x releases
    container_name: deadair-tv
    restart: unless-stopped
    env_file: .env
    volumes:
      # A directory (not a single file) so the Settings page can save atomically.
      - ./config:/config
      - ./data:/data
    # Expose only if you're not putting it on the same Docker network as
    # Nginx Proxy Manager (in that case, proxy to http://deadair-tv:8000).
    ports:
      - "8000:8000"
