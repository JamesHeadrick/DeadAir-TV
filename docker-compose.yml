services:
  deadair-tv:
    build: .
    image: deadair-tv:latest
    container_name: deadair-tv
    restart: unless-stopped
    env_file: .env
    volumes:
      # A directory (not a single file) so the Settings page can save atomically.
      - ./config:/config
      - ./data:/data
    # Expose only if you're not putting it on the same Docker network as
    # Nginx Proxy Manager (in that case, proxy to http://deadair-tv:8000).
    ports:
      - "8000:8000"
