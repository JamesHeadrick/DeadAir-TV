# Copy to channels.yaml and edit. Find tmdb_id in the URL of a show on
# themoviedb.org, e.g. https://www.themoviedb.org/tv/1400-seinfeld -> 1400.
#
# service:  must match the provider name TMDB/JustWatch uses in your region
#           (case/punctuation-insensitive; "Disney+" == "Disney Plus").
#           If a show gets flagged as moved, the UI lists the names TMDB reports.
# show_url: deep link opened by the "Open" button (and sent to the TV in phase 2).
# weight:   optional, default 1. Multiplies the odds of each of this show's
#           episodes: weight 2 = each episode twice as likely as normal.
# name:     optional display-name override.
#
# The show_url values below are placeholders - paste the real links from
# your streaming apps.

channels:
  Sitcoms:
    - tmdb_id: 1400      # Seinfeld
      service: Netflix
      show_url: https://www.netflix.com/title/REPLACE_ME
    - tmdb_id: 2316      # The Office (US)
      service: Peacock Premium
      show_url: https://www.peacocktv.com/REPLACE_ME
      weight: 1.5

  Cartoons:
    - tmdb_id: 456       # The Simpsons
      service: Disney Plus
      show_url: https://www.disneyplus.com/REPLACE_ME
    - tmdb_id: 615       # Futurama
      service: Hulu
      show_url: https://www.hulu.com/series/REPLACE_ME
